<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Tablero del proyecto</title>
  <style>
    :root {
      --paper: #eef0ec;
      --surface: #fbfcfa;
      --ink: #1d2c27;
      --muted: #69756f;
      --line: #d8ded9;
      --forest: #203a31;
      --forest-2: #355448;
      --bronze: #a66543;
      --gold: #b4935a;
      --shadow: 0 14px 40px rgba(27, 43, 36, .07);
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Aptos", "Segoe UI", system-ui, sans-serif;
      --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: var(--sans); font-size: 14px; line-height: 1.5; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--bronze); outline-offset: 3px; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 228px minmax(0,1fr); }
    /* La barra se desplaza sola cuando sus hojas no caben en la altura de la pantalla. */
    .rail { position: sticky; top: 0; height: 100vh; padding: 25px 17px; display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; background: var(--forest); color: #f3f5f1; }
    .brand { display: flex; gap: 11px; align-items: center; padding: 4px 9px 27px; border-bottom: 1px solid rgba(255,255,255,.17); }
    .seal { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid rgba(225,235,227,.65); border-radius: 50%; color: #d8c9a9; font-family: var(--serif); font-size: 18px; }
    .brand strong { display: block; font-family: var(--serif); font-size: 17px; font-weight: 500; letter-spacing: .02em; }
    .brand small { display: block; margin-top: 1px; color: #aebdb4; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .rail-label { margin: 27px 10px 9px; color: #91a69b; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .rail nav { display: grid; gap: 4px; }
    .nav-link { display: flex; align-items: center; gap: 11px; padding: 10px 11px; border-radius: 7px; color: #d6dfd9; text-decoration: none; font-size: 13px; transition: background .18s ease, color .18s ease; }
    .nav-link:hover, .nav-link.active { background: rgba(255,255,255,.11); color: white; }
    .nav-mark { width: 9px; height: 9px; border-radius: 50%; border: 1px solid #b8c6bc; }
    .nav-sub { display: grid; gap: 1px; margin: 2px 0 6px 31px; }
    .nav-sub button { padding: 4px 8px; border: 0; border-radius: 5px; background: none; color: #a9bab0; font-size: 11px; text-align: left; }
    .nav-sub button:hover { background: rgba(255,255,255,.08); color: white; }
    .rail-bottom { margin-top: auto; padding: 15px 10px 4px; border-top: 1px solid rgba(255,255,255,.16); color: #b4c2ba; font-size: 11px; }
    main { min-width: 0; max-width: 1600px; padding: 28px clamp(22px, 4vw, 58px) 62px; }
    .topline { display: flex; justify-content: space-between; gap: 20px; align-items: center; margin-bottom: 28px; }
    .crumb { color: var(--muted); font-size: 12px; }
    .crumb b { color: var(--ink); font-weight: 600; }
    .top-actions { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
    .date-pill { padding: 7px 10px; border: 1px solid var(--line); border-radius: 99px; background: rgba(255,255,255,.48); color: #56645d; font-family: var(--mono); font-size: 10px; }
    .button { min-height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 7px 13px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); font-size: 12px; font-weight: 650; text-decoration: none; transition: transform .18s ease, background .18s ease; }
    .button:hover { transform: translateY(-1px); background: white; }
    .eyebrow { color: var(--bronze); font-size: 10px; font-weight: 750; letter-spacing: .18em; text-transform: uppercase; }
    .hero { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0,1.4fr) minmax(240px,.6fr); gap: 32px; align-items: end; padding: clamp(24px,4vw,43px); border-radius: 8px; background: var(--forest); color: #f4f5f0; box-shadow: var(--shadow); }
    .hero:after { content: ""; position: absolute; width: 300px; height: 300px; right: 18%; top: -240px; border: 1px solid rgba(229,220,198,.2); border-radius: 50%; box-shadow: 0 0 0 35px rgba(255,255,255,.025),0 0 0 70px rgba(255,255,255,.025); pointer-events: none; }
    .hero h1 { position: relative; z-index: 1; max-width: 760px; margin: 11px 0 12px; font-family: var(--serif); font-size: clamp(28px,3.6vw,46px); font-weight: 400; line-height: 1.08; letter-spacing: -.03em; text-wrap: pretty; }
    .hero p { position: relative; z-index: 1; max-width: 680px; margin: 0; color: #c9d3cc; font-size: 13px; }
    .hero .eyebrow { position: relative; z-index: 1; color: #d9c28f; }
    .hero-note { position: relative; z-index: 1; padding: 16px 17px 16px 19px; border-left: 1px solid var(--gold); background: rgba(255,255,255,.055); color: #dce4dd; font-size: 12px; }
    .hero-note strong { display: block; margin-bottom: 5px; color: #d9c28f; font-size: 10px; letter-spacing: .13em; text-transform: uppercase; }
    .hero-link { position: relative; z-index: 1; display: inline-block; margin-top: 14px; color: #e3d6b6; font-size: 12px; }
    .kpis { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); margin: 18px 0 30px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
    .kpi { min-height: 99px; padding: 18px 22px; border-right: 1px solid var(--line); }
    .kpi:last-child { border-right: 0; }
    .kpi-label { color: var(--muted); font-size: 11px; }
    .kpi-value { margin-top: 7px; font-family: var(--serif); font-size: 28px; line-height: 1; }
    .kpi-detail { margin-top: 7px; color: #85918a; font-size: 10px; }
    .section { margin-top: 34px; scroll-margin-top: 24px; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 14px; }
    .section-head h2 { margin: 4px 0 0; font-family: var(--serif); font-size: 27px; font-weight: 400; letter-spacing: -.02em; }
    .section-head p { max-width: 480px; margin: 0; color: var(--muted); font-size: 11px; text-align: right; }
    .grid-two { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(310px,.9fr); gap: 15px; }
    .panel { min-width: 0; padding: 20px 21px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
    .panel-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; margin-bottom: 17px; }
    .panel-head h3 { margin: 0; font-size: 13px; font-weight: 700; }
    .panel-head p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
    .panel-kicker { color: #8d9992; font-family: var(--mono); font-size: 10px; white-space: nowrap; }
    .bars { display: grid; gap: 11px; }
    .bar-row { display: grid; grid-template-columns: minmax(96px,.8fr) minmax(70px,1.6fr) 44px; gap: 10px; align-items: center; font-size: 10px; color: #58675f; }
    .bar-track { height: 11px; overflow: hidden; border-radius: 2px; background: #edf0ed; }
    .bar-fill { height: 100%; min-width: 2px; background: var(--forest-2); }
    .bar-value { color: var(--ink); font-family: var(--mono); text-align: right; }
    .group { display: grid; grid-template-columns: minmax(96px,.8fr) minmax(70px,1.6fr); gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid #eef1ee; font-size: 10px; color: #58675f; }
    .group:first-child { border-top: 0; }
    .group-bars { display: grid; gap: 4px; }
    .group-bar { display: grid; grid-template-columns: minmax(40px,1fr) 38px; gap: 8px; align-items: center; }
    .group-bar .bar-track { height: 9px; }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; color: var(--muted); font-size: 11px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
    .chart-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 17px; padding-top: 11px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(230px,1fr)); gap: 10px; }
    .card { padding: 16px 17px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
    .card strong { display: block; margin-bottom: 5px; color: var(--forest-2); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    .card p { margin: 0; color: #46544d; font-size: 12px; }
    .material-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap: 10px; }
    .material-card { padding: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
    .swatch { width: 21px; height: 21px; margin-bottom: 11px; border-radius: 50%; background: repeating-linear-gradient(135deg,#dfe4e0 0 3px,#aeb8b2 3px 5px); }
    .swatch.plata { background: linear-gradient(145deg,#e2e6e3,#a8b1ad); }
    .swatch.bronce { background: linear-gradient(145deg,#a66b49,#6f4936); }
    .swatch.plata-bronce { background: linear-gradient(135deg,#ac714d 0 48%,#dce1de 49%); }
    .swatch.plata-oro { background: linear-gradient(135deg,#d6b25e 0 48%,#dce1de 49%); }
    .swatch.cuero { background: linear-gradient(135deg,#3b2a22 0 55%,#a66b49 56%); }
    .was { margin-left: 5px; color: #9aa59e; text-decoration: line-through; }
    .material-card strong { display: block; font-size: 11px; }
    .material-count { display: block; margin-top: 4px; color: var(--forest); font-family: var(--serif); font-size: 23px; }
    .material-card small { color: var(--muted); font-size: 9px; }
    .decision-strip { display: grid; grid-template-columns: repeat(3,1fr); gap: 1px; overflow: hidden; border: 1px solid var(--line); border-radius: 7px; background: var(--line); }
    .decision { min-height: 124px; padding: 19px 21px; background: var(--surface); }
    .tag { display: inline-flex; padding: 3px 7px; border-radius: 99px; background: #edf2ed; color: #466254; font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .decision:nth-child(2) .tag { background: #f4ece6; color: #905638; }
    .decision:nth-child(3) .tag { background: #f2f0e8; color: #8a7448; }
    .decision h3 { margin: 9px 0 5px; font-family: var(--serif); font-size: 18px; font-weight: 400; }
    .decision p { margin: 0; color: var(--muted); font-size: 11px; }
    .notes { margin: 0; padding: 0; list-style: none; }
    .notes li { padding: 10px 0 10px 18px; border-top: 1px solid var(--line); color: #46544d; font-size: 11px; position: relative; }
    .notes li:first-child { border-top: 0; padding-top: 0; }
    .notes li:before { content: ""; position: absolute; left: 2px; top: 16px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
    .notes li:first-child:before { top: 6px; }
    .callout { display: flex; gap: 13px; align-items: start; margin-top: 15px; padding: 14px 16px; border: 1px dashed #bdc7bf; border-radius: 6px; color: #596860; font-size: 12px; }
    .callout a { color: var(--forest-2); font-weight: 650; }
    .callout-mark { flex: 0 0 auto; width: 21px; height: 21px; display: grid; place-items: center; border: 1px solid #c4cfc7; border-radius: 50%; color: var(--forest-2); font-family: var(--serif); }
    .rail .nav-group { margin: 22px 10px 7px; color: #91a69b; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .rail .nav-group:first-child { margin-top: 18px; }
    .status { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 99px; font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
    .status:before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .st-en-curso { background: #e6efe9; color: #2f6a4c; }
    .st-en-analisis { background: #f3ecdc; color: #8a6a26; }
    .st-pendiente { background: #eceeec; color: #5d6a63; }
    .st-por-definir { background: #f4ebe6; color: #95563a; }
    .st-bloqueado { background: #ece9f2; color: #5f4f86; }
    .st-acordado { background: #e3eef0; color: #2e6470; }
    .path { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 30px; }
    .path-step { position: relative; padding: 20px 21px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
    .path-step:not(:last-child):after { content: "→"; position: absolute; right: -24px; top: 50%; transform: translateY(-50%); color: var(--gold); font-family: var(--serif); font-size: 22px; }
    .path-num { color: var(--bronze); font-family: var(--serif); font-size: 26px; line-height: 1; }
    .path-step h3 { margin: 10px 0 8px; font-family: var(--serif); font-size: 19px; font-weight: 400; }
    .path-step p { margin: 9px 0 0; color: #46544d; font-size: 12px; }
    .path-step a { display: inline-block; margin-top: 10px; color: var(--forest-2); font-size: 12px; font-weight: 650; }
    .todo { display: grid; grid-template-columns: minmax(150px,.7fr) minmax(0,2fr) auto; gap: 14px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); font-size: 12px; }
    .todo:first-child { border-top: 0; padding-top: 0; }
    .todo strong { font-size: 12px; }
    .todo span.dep { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .todo p { margin: 0; color: #46544d; }
    .cands { display: grid; grid-template-columns: repeat(auto-fit,minmax(300px,1fr)); gap: 15px; }
    .cand { display: flex; flex-direction: column; gap: 12px; padding: 21px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .cand.fav { border-color: #c9b37e; box-shadow: inset 0 3px 0 var(--gold); }
    .cand-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
    .cand h3 { margin: 0; font-family: var(--serif); font-size: 24px; font-weight: 400; letter-spacing: -.01em; }
    .fav-tag { padding: 3px 8px; border-radius: 99px; background: #f3ecdc; color: #8a6a26; font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
    .cand .origin { margin: 0; color: var(--muted); font-size: 12px; }
    .cand .says { margin: 0; color: #2d3c35; font-size: 13px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 3px 8px; border-radius: 4px; font-family: var(--mono); font-size: 10px; }
    .chip.ok { background: #e6efe9; color: #2f6a4c; }
    .chip.no { background: #f4e9e6; color: #925a4c; text-decoration: line-through; }
    .risk { display: grid; gap: 4px; padding: 10px 12px; border-radius: 6px; background: #f6f7f4; font-size: 11px; color: #46544d; }
    .risk b { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .risk.r-muy-bajo b, .risk.r-bajo b { color: #2f6a4c; }
    .risk.r-medio-alto b { color: #95563a; }
    .risk.r-alto b { color: #9b3b2e; }
    .proscons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .proscons h4 { margin: 0 0 6px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .proscons ul { margin: 0; padding-left: 16px; color: #46544d; font-size: 11px; }
    .proscons li { margin-bottom: 4px; }
    .cand .when { margin: 0; padding-top: 10px; border-top: 1px solid var(--line); color: #46544d; font-size: 11px; }
    .dots { display: inline-flex; gap: 3px; vertical-align: middle; }
    .dots i { width: 8px; height: 8px; border-radius: 50%; background: #e3e7e3; }
    .dots i.on { background: var(--forest-2); }
    .score-table td, .score-table th { text-align: center; }
    .score-table td:first-child, .score-table th:first-child { text-align: left; }
    .score-table tr.total td { font-weight: 700; background: #f6f7f4; }
    .steps { display: grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap: 15px; }
    .step-list { margin: 0; padding: 0; list-style: none; counter-reset: paso; }
    .step-list li { position: relative; padding: 10px 0 10px 30px; border-top: 1px solid var(--line); color: #46544d; font-size: 12px; counter-increment: paso; }
    .step-list li:first-child { border-top: 0; padding-top: 0; }
    .step-list li:before { content: counter(paso); position: absolute; left: 0; top: 10px; width: 20px; height: 20px; display: grid; place-items: center; border: 1px solid var(--gold); border-radius: 50%; color: var(--bronze); font-family: var(--serif); font-size: 11px; }
    .step-list li:first-child:before { top: 0; }
    .premium-item { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
    .premium-item:first-child { border-top: 0; }
    .premium-index { color: #9aa59e; font-family: var(--mono); font-size: 10px; }
    .premium-name { font-size: 11px; }
    .premium-name a { display: block; margin-top: 2px; color: #8a958e; font-size: 9px; }
    .premium-price { font-family: var(--serif); font-size: 17px; white-space: nowrap; }
    .months { display: flex; align-items: end; gap: 3px; height: 120px; padding-top: 8px; }
    .month { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: end; align-items: center; height: 100%; }
    .month-bar { width: 100%; min-height: 1px; border-radius: 2px 2px 0 0; }
    .month-axis { display: flex; justify-content: space-between; margin-top: 6px; color: var(--muted); font-family: var(--mono); font-size: 9px; }
    .table-panel { padding: 0; overflow: hidden; }
    .table-tools { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 11px; padding: 15px 17px; border-bottom: 1px solid var(--line); }
    .filters { display: flex; flex: 1 1 auto; flex-wrap: wrap; gap: 7px; }
    .control { min-height: 34px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 4px; background: white; color: #43534a; font-size: 11px; }
    .control.search { width: min(245px,100%); }
    .table-wrap { overflow: auto; max-height: 580px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { position: sticky; top: 0; z-index: 1; padding: 10px 15px; background: #f4f6f3; color: #758079; font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    td { padding: 10px 15px; border-top: 1px solid #e9ede9; font-size: 11px; vertical-align: top; }
    tbody tr:hover { background: #f7f9f6; }
    td.num { font-family: var(--mono); font-size: 10px; white-space: nowrap; }
    td a { color: var(--forest-2); text-underline-offset: 2px; }
    .compare th:first-child, .compare td:first-child { width: 190px; color: var(--muted); }
    .compare td { font-size: 12px; }
    .compare th { position: static; }
    .pill { display: inline-flex; padding: 3px 7px; border-radius: 99px; background: #eef3ee; color: #4e6e5a; font-size: 9px; white-space: nowrap; }
    .pill.out { background: #f4e9e6; color: #925a4c; }
    .muted-row td { color: #9aa59e; }
    .table-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; }
    .empty { padding: 35px 15px; color: var(--muted); text-align: center; }
    .method-note { margin-top: 21px; padding-top: 13px; border-top: 1px solid var(--line); color: #7a867f; font-size: 10px; }
    .error { padding: 30px; border: 1px dashed var(--bronze); border-radius: 7px; background: var(--surface); }
    @media (max-width: 1050px) {
      .shell { grid-template-columns: 190px minmax(0,1fr); }
      .hero { grid-template-columns: 1fr; gap: 16px; }
      .grid-two { grid-template-columns: 1fr; }
    }
    @media (max-width: 720px) {
      .shell { display: block; }
      .rail { position: static; height: auto; padding: 12px 16px; }
      .brand { padding: 0 3px 11px; border: 0; }
      .rail-label, .rail-bottom, .nav-sub { display: none; }
      /* En el celular las hojas se acomodan en varias filas, para que se vean todas sin deslizar. */
      .rail { overflow: visible; }
      .rail nav { display: flex; flex-wrap: wrap; gap: 4px; }
      .nav-link { flex: 0 0 auto; padding: 7px 10px; border: 1px solid rgba(255,255,255,.14); font-size: 12px; }
      main { padding: 18px 16px 42px; }
      .topline { align-items: start; flex-direction: column; margin-bottom: 18px; }
      .hero { padding: 23px 20px; }
      .kpis { grid-template-columns: repeat(2,1fr); }
      .kpi:nth-child(2) { border-right: 0; }
      .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
      .section-head { align-items: start; flex-direction: column; }
      .section-head p { text-align: left; }
      .decision-strip { grid-template-columns: 1fr; }
      .filters { display: grid; grid-template-columns: 1fr 1fr; }
      .control.search { width: 100%; grid-column: 1 / -1; }
      .table-tools > .button { width: 100%; }
      th, td { padding: 9px 11px; }
      .compare th:first-child, .compare td:first-child { width: 110px; }
      .rail .nav-group { display: none; }
      .path { grid-template-columns: 1fr; gap: 26px; }

a y piedras.","venta_fisica":"Alto Diseño (Cenco Alto Las Condes, 3.er piso) y vitrina en Mundano (MUT).","plataforma":"Shopify.","captacion":"Newsletter con 5% de descuento."},"implicancias":[{"tag":"Surtido","titulo":"El cuello y las orejas mandan","texto":"Collares y aros suman el 70% del catálogo; los anillos, solo el 8%. En Co Rivera es casi al revés. Es una pista de qué categorías mueven la plata de diseño."},{"tag":"Precio","titulo":"Hay escalón de entrada","texto":"El 13% del catálogo cuesta menos de $50 mil (aros chicos, cadenas). Sirve para que alguien compre por primera vez o regale sin gastar mucho, algo que Co Rivera no tiene."},{"tag":"Marca","titulo":"La firma vende, pero es genérica","texto":"Apoyarse en “la diseñadora” funciona, pero el tono (“unidas por las joyas y el buen gusto”) podría ser de cualquier marca. Hay espacio para una historia más propia."}],"observaciones":["Lanzamientos: 44 fichas publicadas en abril de 2026 y 24 entre julio y agosto. Parece trabajar con colecciones por temporada. La fecha publicada puede incluir republicaciones.","Precios del 23-09 al 18-10: de 12 piezas de la portada, 8 mantienen el precio, el Collar Soft Fume Petit subió de $135.000 a $145.000 (7%) y 3 ya no aparecen con ese nombre (Collar Cinta Gold, Collar Malla Gold y Square Granate).","La tienda permite ordenar por “Más vendidos”. Puede ser una pista de lo que más se vende, pero no se usó: robots.txt excluye esa forma de ordenar.","25 fichas no mencionan el material en la descripción. Probablemente son de plata, pero quedan como “No indicado”."],"slug":"igna-valverde","productos":[{"producto":"Anillo Amapola Cuarzo Fumé","precio":225000,"precio_max":225000,"precio_antes":0,"estado":"DISPONIBLE","url":"https://mariaignaciavalverde.cl/products/anillo-amapola-cuarzo-fume","categoria":"Anillos","material":"Plata","piedra":true,"motivo":"Natural / orgánico","publicado":"2026-09-26","incluido":true},{"producto":"Anillo Biarritz doble","precio":239000,"precio_max":2 oducto se parezca tanto a las medallas de Co Rivera.","ficha":[{"tema":"Propuesta","texto":"“Orfebrería sacra”: medallas con alma antigua, hechas a mano, que valoran la imperfección. Se apoya en la fe, la memoria y el regalo con sentido."},{"tema":"Quién está detrás","texto":"Silvana Amoresano, que se presenta como artista plástica argentina radicada en Chile y amante del arte sacro. La portada destaca un “taller propio” (según CLAF, el taller es el de ellos)."},{"tema":"Lenguaje de producto","texto":"Vírgenes, santos, querubines y sagrados corazones. Desde septiembre les puso nombres poéticos (“Fátima, la de los tres pastorcitos”). Las cadenas se venden aparte."},{"tema":"Escalera de precio","texto":"En 24 piezas que se venden en las dos versiones, la de plata cuesta unas 1,5 veces lo que la de bronce. Es una diferencia menor que en Co Rivera y CBC (2,1 veces)."},{"tema":"Experiencia web","texto":"Portada nueva con buscador por devoción, filtro de material, guía “Ayúdame a elegir” y preguntas frecuentes. Sigue sin tienda física y algunas páginas internas están descuidadas."},{"tema":"Línea complementaria","texto":"Vende un aroma para el hogar (home spray), que quedó fuera de las estadísticas de joyas."}],"modelo":{"produccion":"Con stock chico y encargos: 99 de 118 joyas disponibles. El stock publicado suma 285 unidades, casi siempre entre 1 y 6 por pieza.","plazo_entrega":"Los encargos toman cerca de una semana de elaboración. El despacho tarda de 3 a 7 días hábiles desde el pago.","despacho":"Rappi, Starken, Chilexpress y Blue Express. A todo Chile; la portada dice que también envía al extranjero.","envio_gratis":"No: el costo se calcula en el checkout según destino y monto.","cambios":"10 días corridos según la política y 15 días según las preguntas frecuentes (se contradicen). Solo compras online y una sola vez; el envío lo paga el cliente.","garantia":"Si el producto llega en mal estado, lo reponen. No se vio una garantía por fallas de uso.","venta_fisica":"No tiene tienda física.","plataforma":"Tiendanube.","captacion":"Instagram @milagritosdemaria_, WhatsApp y guía para elegir. No se vio un descuento de bienvenida."},"implicancias":[{"tag":"Precio","titulo":"El nicho devocional compite abajo","texto":"Con una mediana de $78 mil y medallas de bronce desde $32 mil, empuja hacia abajo el precio de la medalla religiosa. Si nuestra marca usa vírgenes y santos, va a ser comparada con estos precios."},{"tag":"Marca","titulo":"Ya no es la marca descuidada","texto":"En un mes pasó de una web con imágenes rotas a una portada con estética editorial y nombres poéticos. El espacio de “la versión bien hecha” se está achicando."},{"tag":"Confianza","titulo":"La operación sigue floja","texto":"Políticas que se contradicen, una página con el texto de ejemplo de la plataforma y medios de pago inconsistentes. Para el ABC1, la confianza al comprar puede marcar la diferencia."}],"observaciones":["Precios del 23-09 al 19-10 (comparación aproximada, porque varias medallas cambiaron de nombre): las medallas chicas de bronce bajaron entre 17% y 33% (por ejemplo, Virgen de Luján de $48.000 a $38.000 y Virgen de Lourdes mini de $42.000 a $32.000). Algunas cadenas de plata subieron un poco y las piezas de plata grandes se mantienen.","El catálogo bajó de unas 140 fichas en septiembre a 119.","Los medios de pago no cuadran: las preguntas frecuentes dicen solo transferencia, la portada dice Webpay y las fichas muestran Mercado Pago. Las preguntas frecuentes publican los datos bancarios de una persona; no se guardaron.","Es la única de las cuatro que publica el stock exacto de cada pieza: muestra una producción muy pequeña, de 1 a 6 unidades por diseño."],"slug":"milagritos-de-maria","productos":[{"producto":"Anillo Cuadrado Virgen de los Milagros dorado satinado","precio":95000,"precio_max":95000,"precio_antes":0,"estado":"DISPONIBLE","url":"https://milagritosdemaria.cl/productos/anillo-cuadrado-virgen-de-los-milagros-dorado-satinado/","categoria": mbre de la marca","estado":"acordado","detalle":"Pili Trespalacios (26-10). Ya están @pilitrespalacios en Instagram y pilitrespalacios.cl. Falta el abogado de marcas y el registro en INAPI (clases 14 y 35).","hoja":"nombre"},{"paso":"Constituir la empresa","estado":"pendiente","detalle":"Siguiente paso, ya con el nombre. La razón social puede ser distinta de la marca. Al constituirla, conviene traspasarle el dominio y la cuenta de Instagram."},{"paso":"Marca, web y redes sociales","estado":"en-curso","detalle":"Adelantado: el dominio está en NIC Chile y su DNS en Cloudflare, sin web todavía. Falta elegir la plataforma de la web (tienda o página de presentación), el correo con el dominio y la identidad visual."}],"paralelo":[{"paso":"Proveedor: CLAF Goldsmith","estado":"en-curso","detalle":"Proveedor más probable. Falta formalizar condiciones, costos y plazos."},{"paso":"6 diseños de partida","estado":"en-curso","detalle":"En definición. Los socios ya vieron diseños base de CLAF y deciden cuánto ajustarlos. Uno será la medalla de la Virgen de Covadonga, en bronce y plata: hay 5 opciones en la hoja Colección inicial."},{"paso":"Packaging","estado":"por-definir","detalle":"Caja, bolsa, decoración, carta con mensaje y cuidados de la joya, y aroma."}],"por_definir":[{"tema":"Diferenciación de marca","detalle":"Sobre todo de marca (historia, tono, identidad) y, en parte, de diseño. Compartimos taller con tres competidores.","estado":"por-definir"},{"tema":"Cuánto diseño propio","detalle":"Ajustar diseños base de CLAF, diseñar desde cero o una mezcla.","estado":"por-definir"},{"tema":"Público objetivo y posicionamiento","detalle":"Segmento ABC1 como punto de partida; falta precisar a quién le hablamos y cómo.","estado":"por-definir"},{"tema":"Materiales","detalle":"Bronce y plata como base; el oro es una hipótesis abierta (ningún competidor vende oro macizo).","estado":"por-definir"},{"tema":"Precios, costos y márgenes","detalle":"Necesita los costos de CLAF. Referencia de la competencia: el centro del mercado está entre $80 y $220 mil.","estado":"bloqueado","depende":"Costos de CLAF"},{"tema":"Operación","detalle":"A pedido, con stock o mixta (como CBC), según lo que ofrezca el taller.","estado":"bloqueado","depende":"Respuesta de CLAF"},{"tema":"Canales de venta","detalle":"Tienda propia (Co Rivera, CBC), tiendas de diseño multimarca (Igna en Alto Diseño y MUT) o solo online.","estado":"por-definir"},{"tema":"Contenido para redes","detalle":"CLAF permite grabar la fabricación: usarlo para contar el oficio.","estado":"por-definir"},{"tema":"Capital y presupuesto inicial","detalle":"Sin definir.","estado":"por-definir"},{"tema":"Calendario y fecha de lanzamiento","detalle":"Sin definir.","estado":"por-definir"},{"tema":"Reparto de roles","detalle":"Quién lleva cada tema entre los socios.","estado":"por-definir"}],"paneles":[{"titulo":"Lo que ya sabemos de CLAF","bajada":"Contado por CLAF en las reuniones; falta dejarlo por escrito.","items":["Fabrica para varias marcas (entre ellas Co Rivera, Igna Valverde y Milagritos de María) y permite que cada una presente el taller como propio.","Permite grabar mientras fabrican las joyas, para subir contenido a redes sociales.","Ya vimos varios de sus diseños en persona. Cuánto ajustarlos lo decidimos nosotros.","El modelo 3D de cada marca no se repite con nadie más; es parte de su valor agregado.","Por su cuenta solo vende diseños que no tiene con ninguna marca, casi siempre de alta joyería (anillos de compromiso, argollas). No compite directamente con sus clientes."]},{"titulo":"Preguntas pendientes para CLAF","bajada":"Para la próxima reunión.","items":["¿Podemos dejar por escrito estas condiciones (taller como propio, grabación, exclusividad del modelo 3D)? ¿De quién es el modelo 3D si dejamos de trabajar juntos?","¿Cuánto cuesta una misma pieza en bronce, en plata 950 y en oro 14k o 18k? ¿Cuál es el mínimo por diseño? Con eso validamos si la escalera de “la plata cuesta el doble” nos sirve.","¿Trabajaría con un esquema mixto como el de CBC: algo de stock para entrega inmediata y el resto a pedido? ¿En cuántos días entrega un pedido? (Como referencia: CBC tarda 15 días hábiles, Co Rivera de 15 a 20 y Milagritos cerca de una semana).","¿Le fabrica también a CBC Jewelry? (No recordamos si la nombró.)"]},{"titulo":"Lo que falta validar","bajada":"Sin esto, las conclusiones de la competencia siguen siendo hipótesis.","items":["Costos y márgenes propios: con los precios del taller, ver si podemos vender en el tramo de $80 a $220 mil con un margen sano.","Demanda real: no tenemos ventas de ningún competidor. Hay que probar con clientes (conversaciones, Instagram, una preventa pequeña).","Oro: si el costo permite un precio que el público ABC1 esté dispuesto a pagar por piezas chicas de oro macizo.","Packaging: si el aroma se usa, que sea propio de la marca y no parecido al de Milagritos, que ya vende uno para el hogar."]}]},"nombres":{"actualizado":"2026-10-26","estado":"Elegido el 26-10: Pili Trespalacios. Falta confirmarlo con un abogado de marcas.","titular":"Elegimos Pili Trespalacios: el candidato más fácil de proteger.","bajada":"Se revisaron dominios (.cl y .com), uso del nombre en la web, registro en INAPI (clases 14 de joyería y 35 de venta) y encaje con el segmento. El análisis completo está en docs/01_marca-y-marketing/nombres.md.","nota":"Las notas de 1 a 5 son una opinión para comparar. La búsqueda en INAPI es preliminar y no reemplaza la revisión de un abogado de marcas.","criterios":["Distintivo y fácil de proteger","Disponible en dominios","Fácil de decir y recordar en Chile","Encaje con lujo artesanal ABC1","Historia propia","Se distingue de los competidores"],"candidatos":[{"nombre":"del Pilar Joyas","favorito":true,"origen":"El nombre de Pili. “Pilar” también significa columna, soporte.","comunica":"Cercanía, tradición y feminidad. Evoca además a la Virgen del Pilar.","notas":[1,3,5,3,4,2],"dominios":[{"dominio":"delpilar.cl","libre":false},{"dominio":"delpilar.com","libre":false},{"dominio":"delpilarjoyas.cl","libre":true},{"dominio":"joyasdelpilar.cl","libre":true}],"inapi":{"riesgo":"medio-alto","texto":"“Maria Pilar” está registrada en joyería (clase 14) y “EL PILAR” en todas las clases. En vestuario existen “MARÍA DEL PILAR” y “C. del Pilar”."},"favor":["Fácil de decir, escribir y recordar; cálido y familiar.","Ya es el nombre de trabajo del proyecto.","Historia doble: el nombre de Pili y la idea de “pilar”.","Calza con piezas devocionales, si se decide tenerlas."],"contra":["Riesgo de objeción en INAPI por “Maria Pilar” y “EL PILAR”.","“del Pilar” es muy común en Chile y “Joyas” solo describe el producto.","Los dominios cortos están tomados.","Empuja hacia lo religioso, el segmento más saturado."],"conviene":"Si la marca quiere ser cercana y familiar, con una línea devocional fuerte. Antes de elegirlo, consultar a un abogado de marcas."},{"nombre":"Pili Trespalacios","favorito":true,"origen":"El nombre y primer apellido de Pili.","comunica":"Una persona real detrás de cada pieza: firma de autora, cercanía y un apellido con presencia (“tres palacios”).","notas":[5,5,4,4,5,3],"dominios":[{"dominio":"pilitrespalacios.cl","libre":true},{"dominio":"pilitrespalacios.com","libre":true},{"dominio":"pilartrespalacios.cl","libre":true},{"dominio":"pilartrespalacios.com","libre":true}],"inapi":{"riesgo":"bajo","texto":"Las marcas “Trespalacios” están caducadas. Las marcas “Pili” vigentes son de otras clases; ninguna de joyería."},"favor":["Sigue la fórmula de nombre más apellido de los referentes (Igna Valverde y Co Rivera).","Dominios .cl y .com libres, con “Pili” y con “Pilar”.","Muy distintivo; despejado en INAPI.","Monograma posible (PT) y calza con mostrar a Pili y el taller en redes."],"contra":["Ata la marca a Pili: su imagen y una eventual venta del negocio.","“Pili” es informal; “Pilar Trespalacios” suena más a lujo.","Es largo para logo y cuenta; se apoya en el monograma.","Para registrarlo, Pili debe ser titular o autorizarlo por escrito."],"conviene":"Si Pili quiere ser la cara visible de la marca. Vale la pena probar también “Pilar Trespalacios”."},{"nombre":"San Salvatore","favorito":false,"origen":"Pueblo de Italia de donde es el nonno de Pili (falta precisar cuál: hay varios).","comunica":"Herencia italiana, sofisticación y tradición orfebre. “Salvatore” significa “salvador”.","notas":[1,3,4,4,4,3],"dominios":[{"dominio":"sansalvatore.cl","libre":true},{"dominio":"sansalvatore.com","libre":false}],"inapi":{"riesgo":"alto","texto":"“Salvatore Ferragamo” está registrada en joyería (14) y venta (35); también “Emporio Salvatore” en la clase 14. Las marcas famosas tienen protección más amplia."},"favor":["Historia familiar real y prestigio italiano en joyería.","Fácil de decir en Chile; el .cl está libre."],"contra":["Mayor riesgo de registro de la lista, por Salvatore Ferragamo.","“San” vuelve a lo religioso.","Existe la bodega italiana San Salvatore 1988 y el .com está tomado.","Se puede confundir con San Salvador."],"conviene":"Como nombre de una colección con alma italiana, no como marca principal."},{"nombre":"Parpaglione","favorito":false,"origen":"Segundo apellido de Pili. En italiano significa “mariposa grande”.","comunica":"Transformación, ligereza y luz. Da un ícono natural: la mariposa.","notas":[5,5,2,4,4,5],"dominios":[{"dominio":"parpaglione.cl","libre":true},{"dominio":"parpaglione.com","libre":true}],"inapi":{"riesgo":"muy bajo","texto":"No hay ninguna marca registrada con ese nombre."},"favor":["El más distintivo: casi sin resultados en la web y nada en INAPI.","Dominios .cl y .com libres.","La mariposa da logo, colección insignia e historia.","Ningún competidor usa algo parecido."],"contra":["Difícil de pronunciar y escribir en Chile (en italiano, “parpa-LLO-ne”).","En la poesía antigua, la mariposa nocturna que se quema en la llama es una imagen ambigua.","“Polilla” no es una buena asociación; hay que hablar de mariposa."],"conviene":"Como símbolo o colección insignia (la mariposa), o como marca si se acepta enseñar a pronunciarlo."},{"nombre":"Trespalacios","favorito":false,"origen":"Primer apellido de Pili.","comunica":"Apellido con presencia; “tres palacios” sugiere elegancia y da para un símbolo.","notas":[4,2,4,4,3,4],"dominios":[{"dominio":"trespalacios.cl","libre":false},{"dominio":"trespalacios.com","libre":false},{"dominio":"trespalaciosjoyas.cl","libre":true}],"inapi":{"riesgo":"bajo","texto":"Las marcas “Trespalacios” están caducadas; la única “Tres Palacios” vigente es de vinos (clase 33)."},"favor":["Fácil de decir; suena sólido y elegante.","Despejado en INAPI para joyería."],"contra":["trespalacios.cl lleva al grupo de cumbia Los Tres Palacios, que domina las búsquedas.","Los dominios cortos están tomados.","Pierde la cercanía de “Pili”."],"conviene":"Como razón social de la empresa o como monograma, más que como nombre comercial."}],"lectura":["Pili Trespalacios es el más sólido de los dos favoritos: distintivo, con dominios libres y despejado en INAPI. Su costo es personal, porque Pili pasa a ser la marca.","del Pilar Joyas es el más cálido, pero tiene un problema concreto de registro (“Maria Pilar” y “EL PILAR”). Si lo prefieren, conviene consultarlo con un abogado de marcas antes de constituir la empresa.","San Salvatore queda casi descartado como marca principal por Salvatore Ferragamo; sirve como colección.","Parpaglione es el más “limpio”: si no es la marca, puede ser el símbolo o la colección de la mariposa.","La razón social de la empresa y la marca pueden ser distintas."],"pendientes":["Hecho (26-10): @pilitrespalacios en Instagram.","Hecho (26-10): pilitrespalacios.cl registrado en NIC Chile por 2 años, con DNS en Cloudflare.","Confirmar el nombre con un abogado de marcas y registrarlo en INAPI (clases 14 y 35).","Evaluar registrar también pilartrespalacios.cl y pilitrespalacios.com, que estaban libres.","Acordar entre los socios que el nombre, el dominio y las cuentas se   <script>
    const DATA = window.REFERENTES;
    const el = id => document.getElementById(id);
    const money = v => new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(v);
    const norm = v => String(v ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
    const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pct = (n,total) => total ? Math.round(n/total*100) : 0;
    const fecha = iso => iso ? iso.split('-').reverse().join('.') : '—';
    const median = xs => { if(!xs.length) return 0; const s=[...xs].sort((a,b)=>a-b), m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; };
    const quantile = (xs,q) => { const s=[...xs].sort((a,b)=>a-b); if(!s.length) return 0; const pos=(s.length-1)*q, lo=Math.floor(pos), hi=Math.ceil(pos); return s[lo]+(s[hi]-s[lo])*(pos-lo); };
    const countBy = (items,key) => items.reduce((o,p)=>(o[p[key]]=(o[p[key]]||0)+1,o),{});
    const sorted = counts => Object.entries(counts).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name,'es'));

    // Escalones de precio estándar para todas las hojas.
    const BANDS = [
      {name:'Menos de $50 mil',min:0,max:49999},{name:'$50–79 mil',min:50000,max:79999},{name:'$80–109 mil',min:80000,max:109999},
      {name:'$110–149 mil',min:110000,max:149999},{name:'$150–219 mil',min:150000,max:219999},{name:'$220–399 mil',min:220000,max:399999},{name:'$400 mil o más',min:400000,max:Infinity}
    ];
    const CATEGORIES = ['Anillos','Aros','Collares y cadenas','Colgantes y medallas','Pulseras y esclavas','Cinturones y cuero','Otros'];
    const swatchClass = m => ({'Plata':'plata','Bronce':'bronce','Plata + bronce':'plata-bronce','Plata + oro (enchape)':'plata-oro','Cuero + metal':'cuero'}[m]||'');

    // Cifras derivadas de cada competidor, calculadas una vez.
    function stats(c) {
      const items = c.productos.filter(p=>p.incluido);
      const states = sorted(countBy(c.productos,'estado'));
      const cats = countBy(items,'categoria');
      const catMedian = Object.fromEntries(Object.keys(cats).map(k=>[k,median(items.filter(p=>p.categoria===k).map(p=>p.precio))]));
      return {
        items, total: items.length, excluded: c.productos.length-items.length,
        prices: items.map(p=>p.precio), median: median(items.map(p=>p.precio)),
        p25: quantile(items.map(p=>p.precio),.25), p75: quantile(items.map(p=>p.precio),.75),
        min: Math.min(...items.map(p=>p.precio)), max: Math.max(...items.map(p=>p.precio)),
        bands: BANDS.map(b=>({name:b.name,count:items.filter(p=>p.precio>=b.min&&p.precio<=b.max).length})),
        cats, catMedian, mats: countBy(items,'material'), motifs: countBy(items,'motivo'),
        stones: items.filter(p=>p.piedra).length, states
      };
    }

    // Componentes
    const bars = (entries,total,color,suffix='') => `<div class="bars">${entries.map(x=>`<div class="bar-row"><span>${esc(x.name)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(1,x.count/Math.max(1,...entries.map(e=>e.count))*100)}%;--c:${color};background:var(--c)"></div></div><span class="bar-value">${x.count}${suffix}</span></div>`).join('')}</div>`;

    const hero = (eyebrow,title,text,noteTitle,note,link='') => `<section class="hero"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1><p>${esc(text)}</p>${link}</div><div class="hero-note"><strong>${esc(noteTitle)}</strong>${esc(note)}</div></section>`;

    const SUMMARY_SECTIONS = [['s-cifras','Cifras'],['s-precios','Precios'],['s-mix','Material y motivo'],['s-modelo','Operación'],['s-conclusiones','Implicancias']];

    // Hoja de un competidor
    function renderCompetitor(c) {

          <div class="kpi"><div class="kpi-label">Mediana de precio</div><div class="kpi-value">${money(s.median)}</div><div class="kpi-detail">central: ${money(s.p25)}–${money(s.p75)}</div></div>

          <div class="kpi"><div class="kpi-label">Categoría principal</div><div class="kpi-value">${pct(catEntries[0].count,s.total)}%</div><div class="kpi-detail">${esc(catEntries[0].name)}</div></div>
        </section>
        <section class="section" id="c-marca">
          ${sectionHead('Marca','Quién es y cómo se presenta',`Observaciones del sitio, revisado el ${fecha(c.revision_cualitativa)}.`)}
          <div class="card-grid">${c.ficha.map(f=>`<div class="card"><strong>${esc(f.tema)}</strong><p>${esc(f.texto)}</p></div>`).join('')}</div>

            <article class="panel"><div class="panel-head"><div><h3>Distribución del catálogo</h3><p>Precio publicado más bajo de cada ficha</p></div><span class="panel-kicker">${s.total} CON PRECIO</span></div>${bars(s.bands,s.total,color)}<div class="chart-foot"><span>Rango central: ${money(s.p25)}–${money(s.p75)}</span><span>${money(s.min)}–${money(s.max)}</span></div></article>
            <article class="panel"><div class="panel-head"><div><h3>Mix de categorías</h3><p>Entre paréntesis, mediana de precio de la categoría</p></div><span class="panel-kicker">SKU</span></div>${bars(catEntries.map(x=>({name:`${x.name} (${money(s.catMedian[x.name])})`,count:x.count})),s.total,color)}</article>
          </div>

        <section class="section" id="c-mix">
          ${sectionHead('Construcción del surtido','Materiales y motivos','Etiquetas deducidas; no reemplazan la ficha técnica.')}
          <div class="grid-two">
            <article class="panel"><div class="panel-head"><div><h3>Material</h3><p>${pct(s.stones,s.total)}% de los productos menciona piedra o perla</p></div><span class="panel-kicker">INFERIDO</span></div>
              <div class="material-grid">${sorted(s.mats).map(m=>`<div class="material-card"><span class="swatch ${swatchClass(m.name)}" aria-hidden="true"></span><strong>${esc(m.name)}</strong><span class="material-count">${m.count}</span><small>${pct(m.count,s.total)}% del catálogo</small></div>`).join('')}</div></article>
            <article class="panel"><div class="panel-head"><div><h3>Familias de motivo</h3><p>Según palabras del nombre del producto</p></div><span class="panel-kicker">POR NOMBRE</span></div>${bars(sorted(s.motifs),s.total,color)}</article>
          </div>
        </section>

        </section>

              ${premium.map((p,i)=>`<div class="premium-item"><span class="premium-index">${String(i+1).padStart(2,'0')}</span><div class="premium-name">${esc(p.producto)}<a href="${esc(p.url)}" target="_blank" rel="noopener">Abrir ficha pública</a></div><span class="premium-price" style="--c:${color};color:var(--c)">${money(p.precio)}</span></div>`).join('')}</article>
            <div style="display:grid;gap:15px;align-content:start">

    const COMPETITOR_SECTIONS = [['c-marca','Marca'],['c-precios','Precios'],['c-mix','Material y motivo'],['c-operacion','Operación'],['c-implicancias','Implicancias'],['c-productos','Productos']];

    // Arma el CSV con los datos que ya trae la página, así funciona aunque el archivo viaje solo.
    function downloadCSV(items, filename) {
      const rows=[['producto','precio_clp','precio_max_clp','precio_antes_clp','estado','categoria','material','piedra_o_perla','motivo','incluido_en_analisis','url'],...items.map(p=>[p.producto,p.precio,p.precio_max,p.precio_antes||'',p.estado,p.categoria,p.material,p.piedra?'si':'no',p.motivo,p.incluido?'si':'no',p.url])];
      const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})); a.download=filename; a.click(); URL.revokeObjectURL(a.href);
    }

    function setupExplorer(c) {
      const options = (id,key,label) => { const vals=[...new Set(c.productos.map(p=>p[key]))].sort((a,b)=>a.localeCompare(b,'es')); el(id).innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join(''); };
      options('f-cat','categoria','Todas las categorías'); options('f-mat','material','Todos los materiales'); options('f-state','estado','Todos los estados');
      let list = [];
      const update = () => {
        const q=norm(el('f-search').value), cat=el('f-cat').value, mat=el('f-mat').value, st=el('f-state').value, sort=el('f-sort').value;
        list = c.productos.filter(p=>(!q||norm(`${p.producto} ${p.motivo}`).includes(q))&&(!cat||p.categoria===cat)&&(!mat||p.material===mat)&&(!st||p.estado===st));
        const by = {asc:(a,b)=>a.precio-b.precio, desc:(a,b)=>b.precio-a.precio, date:(a,b)=>(b.publicado||'').localeCompare(a.publicado||''), name:(a,b)=>a.producto.localeCompare(b.producto,'es')}[sort];
        list.sort(by);
        el('f-rows').innerHTML = list.length ? list.map(p=>`<tr class="${p.incluido?'':'muted-row'}"><td>${esc(p.producto)}</td><td>${esc(p.categoria)}</td><td>${esc(p.material)}${p.piedra?' · piedra/perla':''}</td><td>${esc(p.motivo)}</td><td><span class="pill ${/agotado/i.test(p.estado)?'out':''}">${esc(p.estado)}</span></td><td class="num">${p.precio?money(p.precio):'—'}${p.precio_max>p.precio?`–${money(p.precio_max)}`:''}${p.precio_antes>p.precio?`<span class="was">${money(p.precio_antes)}</span>`:''}</td><td>${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">Ver ficha</a>`:''}</td></tr>`).join('') : `<tr><td class="empty" colspan="7">No hay productos con estos filtros.</td></tr>`;
        el('f-count').textContent = `${list.length} de ${c.productos.length} fichas`;
      };
      ['f-search','f-cat','f-mat','f-state','f-sort'].forEach(id=>el(id).addEventListener(id==='f-search'?'input':'change',update));
      el('f-export').addEventListener('click',()=>downloadCSV(list,`${c.slug}-seleccion.csv`));
      el('export-all').addEventListener('click',()=>downloadCSV(c.productos,`${c.slug}-catalogo.csv`));
      update();
    }

    function renderRoadmap() {

      const count = s => all.filter(x=>x.estado===s).length;

    const NAMES_SECTIONS = [['n-comparacion','Comparación'],['n-candidatos','Candidatos'],['n-lectura','Lectura y pendientes']];

    // ---- Colección inicial ----
    // Bocetos esquemáticos (SVG) para comparar formas; no son el diseño final.

      plata: {label:'Plata', hi:'#f6f7f8', mid:'#bfc5cb', lo:'#626a72'},

    let sketchId = 0;
    const gradient = (m,id) => `<radialGradient id="${id}" cx="35%" cy="28%" r="85%"><stop offset="0" stop-color="${m.hi}"/><stop offset="1" stop-color="${m.mid}"/></radialGradient>`;
    const ring = (x,y,m) => `<circle cx="${x}" cy="${y}" r="5" fill="none" stroke="${m.lo}" stroke-width="2.2"/>`;
    // La Santina: corona, manto triangular, el Niño en el brazo izquierdo y la flor en la mano derecha.
    const santina = (x,y,s,fill,m) => `<g transform="translate(${x} ${y}) scale(${s})" fill="${fill}" stroke="${m.lo}" stroke-width="${(1.1/s).toFixed(2)}" stroke-linejoin="round">
      <path d="M-7 11 L-9 2 L-4.5 6 L0 -1 L4.5 6 L9 2 L7 11 Z"/><circle cx="0" cy="17" r="6"/>
      <path d="M-6 23 Q-11 25 -13 33 L-27 92 Q0 99 27 92 L13 33 Q11 25 6 23 Z"/>
      <path d="M0 44 L-8 92 M0 44 L8 92" fill="none" opacity=".55"/>
      <path d="M8 40 Q13 37 18 40 L17 54 L9 54 Z"/><circle cx="13" cy="35" r="4.5"/><circle cx="-14" cy="44" r="3"/>
      <path d="M-20 94 L20 94 L18 100 L-18 100 Z"/></g>`;
    // Cruz de la Victoria, con el alfa y la omega colgando de los brazos.
    const cruz = (x,y,s,fill,m) => `<g transform="translate(${x} ${y}) scale(${s})" fill="${fill}" stroke="${m.lo}" stroke-width="${(1.1/s).toFixed(2)}" stroke-linejoin="round">
      <path d="M-3.5 -40 H3.5 V-15.5 H30 V-8.5 H3.5 V44 H-3.5 V-8.5 H-30 V-15.5 H-3.5 Z"/>
      <circle cx="0" cy="-41" r="4.5"/><circle cx="0" cy="45" r="4.5"/><circle cx="-31" cy="-12" r="4.5"/><circle cx="31" cy="-12" r="4.5"/><circle cx="0" cy="-12" r="7"/>
      <path d="M-20 -8 V3 M20 -8 V3" fill="none"/>
      <text x="-20" y="15" font-size="12" text-anchor="middle" stroke="none" fill="${m.lo}" font-family="Georgia,serif">A</text>
      <text x="20" y="15" font-size="12" text-anchor="middle" stroke="none" fill="${m.lo}" font-family="Georgia,serif">ω</text></g>`;
    // Borde irregular, como una moneda antigua fundida.
    const blob = (cx,cy,k) => {
      const R = [44,42.5,44.5,43,41.8,44,43.2,42,44.6,43,42.2,44,43.5,42.4,44.2,43];
      const pts = R.map((v,i)=>{const a=i/R.length*2*Math.PI-Math.PI/2; return [cx+Math.cos(a)*v*k, cy+Math.sin(a)*v*k];});
      const mid = (p,q) => `${((p[0]+q[0])/2).toFixed(1)} ${((p[1]+q[1])/2).toFixed(1)}`;
      return `M${mid(pts[pts.length-1],pts[0])}` + pts.map((p,i)=>` Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${mid(p,pts[(i+1)%pts.length])}`).join('') + 'Z';
    };
    const SKETCHES = {
      clasica: (m,g) => `${ring(60,13,m)}
        <path d="M36 36 L33 21 L44 29 L52 17 L60 27 L68 17 L76 29 L87 21 L84 36 Z" fill="url(#${g})" stroke="${m.lo}" stroke-linejoin="round"/>
        <path d="M37 36 H83 L81 45 H39 Z" fill="url(#${g})" stroke="${m.lo}"/>
        <text x="60" y="43" font-size="5.6" text-anchor="middle" fill="${m.lo}" font-family="Georgia,serif" letter-spacing=".6">ASTURIAS</text>
        <ellipse cx="60" cy="92" rx="34" ry="46" fill="url(#${g})" stroke="${m.lo}" stroke-width="1.3"/>
        <ellipse cx="60" cy="92" rx="25" ry="36" fill="none" stroke="${m.lo}"/>
        <path id="${g}-t" d="M30.5 92 a29.5 41 0 1 1 59 0" fill="none"/>
        <text font-size="5.4" fill="${m.lo}" font-family="Georgia,serif" letter-spacing=".5"><textPath href="#${g}-t" startOffset="50%" text-anchor="middle">NUESTRA SEÑORA DE COVADONGA</textPath></text>
        ${santina(60,59,.54,`url(#${g})`,m)}`,
      silueta: (m,g) => `${ring(60,16,m)}${santina(60,22,1.15,`url(#${g})`,m)}`,
      doblefaz: (m,g) => `${ring(33,55,m)}${ring(89,55,m)}
        <circle cx="33" cy="84" r="25" fill="url(#${g})" stroke="${m.lo}" stroke-width="1.3"/><circle cx="33" cy="84" r="20.5" fill="none" stroke="${m.lo}"/>
        <circle cx="89" cy="84" r="25" fill="url(#${g})" stroke="${m.lo}" stroke-width="1.3"/><circle cx="89" cy="84" r="20.5" fill="none" stroke="${m.lo}"/>
        ${santina(33,63,.4,`url(#${g})`,m)}${cruz(89,85,.43,`url(#${g})`,m)}
        <text x="33" y="124" font-size="7" text-anchor="middle" fill="${m.lo}">anverso</text><text x="89" y="124" font-size="7" text-anchor="middle" fill="${m.lo}">reverso</text>`,
      cueva: (m,g) => `${ring(60,37,m)}
        <path d="${blob(60,87,1)}" fill="url(#${g})" stroke="${m.lo}" stroke-width="1.3"/>
        <path d="${blob(60,87,.86)}" fill="none" stroke="${m.lo}" opacity=".7"/>
        <path d="M37 116 L37 85 Q37 58 60 56 Q83 58 83 85 L83 116 Z" fill="${m.lo}" fill-opacity=".28" stroke="${m.lo}"/>
        ${santina(60,63,.46,`url(#${g})`,m)}
        <path d="M41 119 q4.75 -3 9.5 0 t9.5 0 t9.5 0 t9.5 0 M45 124 q3.75 -2.5 7.5 0 t7.5 0 t7.5 0 t7.5 0" fill="none" stroke="${m.lo}" stroke-linecap="round"/>`,
      bicolor: (m,g,m2,g2) => `${ring(60,39,m)}
        <circle cx="60" cy="85" r="40" fill="url(#${g})" stroke="${m.lo}" stroke-width="1.3"/><circle cx="60" cy="85" r="32" fill="none" stroke="${m.lo}"/>
        ${santina(60,53,.62,`url(#${g2})`,m2)}`,
    };
    const sketch = (tipo,base,figura) => {
      const m = METALS[base], m2 = METALS[figura||base], g = `sk${++sketchId}`, g2 = `sk${++sketchId}`;
      const label = figura && figura!==base ? `${m.label} + ${m2.label.toLowerCase()}` : m.label;
      return `<figure class="sketch"><svg viewBox="${tipo==='doblefaz'?'4 46 114 84':'0 0 120 150'}" role="img" aria-label="Boceto en ${esc(label.toLowerCase())}"><defs>${gradient(m,g)}${gradient(m2,g2)}</defs>${SKETCHES[tipo](m,g,m2,g2)}</svg><figcaption>${esc(label)}</figcaption></figure>`;
    };

          <div class="kpi"><div class="kpi-label">Recomendada</div><div class="kpi-value" style="font-size:22px">${esc(rec?rec.nombre:'—')}</div><div class="kpi-detail">con la Cruz de la Victoria detrás</div></div>
          <div class="kpi"><div class="kpi-label">Precio sugerido</div><div class="kpi-value" style="font-size:22px">${esc(clasica.bronce)}</div><div class="kpi-detail">bronce · plata ${esc(clasica.plata)} (hipótesis)</div></div>
          <div class="kpi"><div class="kpi-label">Medalla estándar en Chile</div><div class="kpi-value" style="font-size:22px">${esc(piso?piso.plata.replace(/\s*\(.*\)/,''):'—')}</div><div class="kpi-detail">en plata 950, sin diseño propio</div></div>
        </section>
        <section class="section" id="m-contexto">
          ${sectionHead('Contexto','Por qué esta pieza y qué debe reconocerse','Separando hechos de hipótesis.')}
          <div class="grid-two">
            <article class="panel"><div class="panel-head"><div><h3>Por qué la Santina</h3><p>Lo que sabemos y lo que suponemos</p></div></div><ul class="notes">${d.contexto.map(x=>`<li><span class="fact-tag ${x.tipo==='Hecho'?'':'hip'}">${esc(x.tipo)}</span>${esc(x.texto)}</li>`).join('')}</ul></article>
            <article class="panel"><div class="panel-head"><div><h3>Rasgos de la imagen</h3><p>Lo que hace que la gente la reconozca</p></div></div><ul class="notes">${d.rasgos.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article>

          ${sectionHead('Opciones',`${d.opciones.length} caminos de diseño`,'Bocetos esquemáticos para comparar formas; no son el diseño final ni lo que hará el taller.')}
          <div class="cands">${d.opciones.map(o=>`<article class="cand ${o.recomendada?'fav':''}">

          </article>`).join('')}</div>
        </section>
        <section class="section" id="m-precios">
          ${sectionHead('Precios','La competencia y nuestra propuesta','Precios publicados en catálogos capturados entre el 11 y el 19 de octubre de 2026. No son ventas.')}
          <div class="panel table-panel"><div class="table-wrap"><table>
            <thead><tr><th>Marca</th><th>Pieza</th><th>Bronce</th><th>Plata</th></tr></thead>
            <tbody>${d.precios_competencia.map(p=>`<tr><td>${esc(p.marca)}</td><td>${esc(p.pieza)}</td><td class="num">${esc(p.bronce)}</td><td class="num">${esc(p.plata)}</td></tr>`).join('')}</tbody>
          </table></div></div>

            <article class="panel table-panel"><div class="panel-head" style="padding:17px 17px 0"><div><h3>Precio sugerido</h3><p>Hipótesis, pendiente de los costos de CLAF</p></div></div><div class="table-wrap"><table>
              <thead><tr><th>Versión</th><th>Bronce</th><th>Plata</th></tr></thead>
              <tbody>${d.precio_sugerido.map(p=>`<tr><td>${esc(p.version)}</td><td class="num">${esc(p.bronce)}</td><td class="num">${esc(p.plata)}</td></tr>`).join('')}</tbody>
            </table></div></article>
            <article class="panel"><div class="panel-head"><div><h3>Cómo se llegó al precio</h3><p>Lectura de la competencia</p></div></div><ul class="notes">${d.notas_precio.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article>

          ${sectionHead('Para decidir','Recomendación, taller y pendientes','La recomendación es una opinión para conversar; la decisión es de los socios.')}

            {titulo:'Preguntas para CLAF', bajada:'Para la próxima reunión', items:d.preguntas_claf},

            <thead><tr><th>Tipo</th><th>Ejemplo</th><th>Lo que aporta</th></tr></thead>
            <tbody>${d.referencias.map(r=>`<tr><td>${esc(r.tipo)}</td><td><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.nombre)} ↗</a></td><td>${esc(r.aporta)}</td></tr>`).join('')}</tbody>
          </table></div></div>

        <div class="method-note"><strong>Fuente:</strong> docs/02_producto/coleccion/${esc(d.slug)}.json y ${esc(d.slug)}.md, al ${fecha(d.actualizado)}. Los precios de la competencia salen de docs/03_mercado/competencia/.</div>`;

    const DESIGN_SECTIONS = [['m-contexto','Contexto'],['m-opciones','Opciones'],['m-precios','Precios'],['m-siguiente','Para decidir'],['m-referencias','Referencias']];

    // Navegación entre hojas por el hash de la URL (#resumen, #co-rivera, #hoja-de-ruta, ...).
    const PAGES = {
      'hoja-de-ruta': {nombre:'Hoja de ruta', grupo:'Definiciones de marca', color:'#d3b882', render:()=>renderRoadmap(), sections:ROADMAP_SECTIONS, fecha:()=>DATA.definiciones.actualizado},
      'nombre': {nombre:'Nombre de la marca', grupo:'Definiciones de marca', color:'#d3b882', render:()=>renderNames(), sections:NAMES_SECTIONS, fecha:()=>DATA.nombres.actualizado},
    };
    const GROUPS = ['Definiciones de marca','Colección inicial'];
    function route() {
      const slug = location.hash.slice(1) || 'resumen';
      const comp = DATA.competidores.find(c=>c.slug===slug);
      const page = PAGES[slug];
      const current = comp ? comp.slug : page ? slug : 'resumen';
      const sections = comp ? COMPETITOR_SECTIONS : page ? page.sections : SUMMARY_SECTIONS;
      const link = s => `<a class="nav-link ${s.slug===current?'active':''}" href="#${s.slug}"><span class="nav-mark" style="${s.slug===current?`--c:${s.color};background:var(--c);border-color:var(--c)`:''}"></span>${esc(s.nombre)}</a>${s.slug===current?`<div class="nav-sub">${sections.map(([id,label])=>`<button type="button" data-scroll="${id}">${esc(label)}</button>`).join('')}</div>`:''}`;
      const competencia = [{slug:'resumen',nombre:'Resumen comparativo',color:'#d3b882'},...DATA.competidores];
      const pages = grupo => Object.entries(PAGES).filter(([,p])=>p.grupo===grupo).map(([slug,p])=>({slug,nombre:p.nombre,color:p.color}));
      el('sheet-nav').innerHTML = `<div class="nav-group">Análisis de competencia</div>${competencia.map(link).join('')}`
        + GROUPS.map(g=>pages(g)).map((ps,i)=>ps.length?`<div class="nav-group">${esc(GROUPS[i])}</div>${ps.map(link).join('')}`:'').join('');
      const grupo = page ? page.grupo : 'Análisis de competencia';
      const titulo = comp ? comp.nombre : page ? page.nombre : 'Resumen comparativo';
      el('crumb').innerHTML = `${esc(grupo)} <span aria-hidden="true">/</span> <b>${esc(titulo)}</b>`;
      el('top-actions').innerHTML = comp
        ? `<span class="date-pill">CAPTURA · ${fecha(comp.captura_catalogo)}</span><button class="button" id="export-all" type="button">Descargar catálogo CSV</button>`
        : page ? `<span class="date-pill">ACTUALIZADO · ${fecha(page.fecha())}</span>`
        : `<span class="date-pill">DATOS GENERADOS · ${fecha(DATA.generado)}</span>`;
      el('sheet').innerHTML = comp ? renderCompetitor(comp) : page ? page.render() : renderSummary();
      if (comp) setupExplorer(comp);
      document.title = `${titulo} | Tablero del proyecto`;
      window.scrollTo(0,0);
    }
    document.addEventListener('click',e=>{const b=e.target.closest('[data-scroll]');if(b)el(b.dataset.scroll)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});});

    if (!DATA) {
      el('sheet').innerHTML = '<div class="error"><strong>Este tablero no tiene datos.</strong> Hay que generarlos con <code>python docs/00_tablero/generar_dashboard.py</code>.</div>';
    } else {
      DATA.competidores.forEach(c=>c.s=stats(c));
      el('rail-bottom').innerHTML = `${DATA.competidores.length} competidores · datos del ${fecha(DATA.generado)}<br>Todo se procesa en este navegador`;
      // Sin los datos de docs/01_marca-y-marketing/, la sección de definiciones no se muestra.
      if (!DATA.definiciones || !DATA.nombres) { delete PAGES['hoja-de-ruta']; delete PAGES['nombre']; }
      // Cada diseño de docs/02_producto/coleccion/ es una hoja del grupo "Colección inicial".
      (DATA.coleccion||[]).forEach(d=>{ PAGES[d.slug] = {nombre:d.nombre, grupo:'Colección inicial', color:'#d3b882', render:()=>renderDesign(d), sections:DESIGN_SECTIONS, fecha:()=>d.actualizado}; });
      window.addEventListener('hashchange',route);
      route();
    }
  </script>
</body>
</html>
